name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies only
        # Deliberately skip heavy deps (torch/sentence-transformers) — guardrails tests
        # don't need them, and installing torch in CI just to run 12 unit tests is wasteful.
        run: pip install pytest pydantic
      - run: python -m pytest tests/ -v
